spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: manbanjalbu-bo-be

  datasource:
    # 3307 포트의 localhost로 지정하여 터널을 타도록 합니다.
    url: jdbc:mysql://localhost:3308/manbanjalbu
    username: admin
    password: manbanjalbu
    driver-class-name: com.mysql.cj.jdbc.Driver

#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/starbucks7th?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
#    username: ${DB_USERNAME:root}
#    password: ${DB_PASSWORD:1234}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:manbanjalbu-bo-local-dev-secret-key-min-256-bits-long!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  upload:
    base-dir: ${UPLOAD_BASE_DIR:uploads}
    public-url-prefix: ${UPLOAD_PUBLIC_URL_PREFIX:http://localhost:8081/uploads}

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
